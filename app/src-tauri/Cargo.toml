[package]
name = "expiryscalping-app"
version = "0.3.0"
description = "ExpiryScalping desktop app"
edition = "2024"
publish = false

[lib]
name = "expiryscalping_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
